[project]
name = "captcha-ocr"
version = "0.1.0"
description = "A configurable, multi-strategy OCR pipeline for noisy captcha images (white background, colored glyphs & noise), powered by Tesseract under the hood."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "captcha-ocr contributors" }]
keywords = ["captcha", "ocr", "tesseract", "image", "verification-code"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# 运行期依赖：图像处理用 Pillow；Tesseract 为外部命令行工具，
# 见 README「外部依赖」。
dependencies = [
    "pillow>=10.0",
]

# 命令行入口：安装后即用 `captcha-ocr`
[project.scripts]
captcha-ocr = "captcha_ocr.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["captcha_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["captcha_ocr"]
